name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/pinky-go

      - name: Build WebAssembly runtime
        run: GOOS=js GOARCH=wasm go build ./cmd/pinky-go-browser